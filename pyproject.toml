[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shrinkage"
version = "0.1.2"
description = "Linear and nonlinear shrinkage estimators for covariance matrices following Ledoit and Wolf"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Thomas Schmelzer", email = "thomas.s@yukkalab.com" },
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=2.4.6",
]

[project.urls]
Homepage = "https://github.com/Jebel-Quant/shrinkage"
Repository = "https://github.com/Jebel-Quant/shrinkage"

[dependency-groups]
test = [
    "hypothesis>=6.164.0",
    "pytest>=9.1.1",
    "pytest-cov>=5.0",
]
lint = ["ruff>=0.16.1"]

[tool.deptry]
per_rule_ignores = {"DEP002" = ["pytest", "pytest-cov", "hypothesis"]}

[tool.hatch.build.targets.wheel]
packages = ["src/shrinkage"]

[tool.bumpversion]
# Authoritative list of every location this repo's version is written.
# bump-my-version rewrites ONLY the patterns declared here, so a dependency that
# happens to share the version number is never touched. Kept in pyproject.toml
# because that is one of the four filenames bump-my-version auto-discovers
# (.bumpversion.toml, .bumpversion.cfg, setup.cfg, pyproject.toml) — a block
# anywhere else is inert, and inert is silent: with no config found the tool
# falls back to `git describe` rather than failing. This table used to live in
# .rhiza/.cfg.toml, which was never one of those four names.
#
# current_version is deliberately absent: bump-my-version reads [project].version
# natively, and a second copy only drifts.
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(?:[-]?(?P<release>[a-z]+)[\\.]?(?P<pre_n>\\d+))?(?:\\+build\\.(?P<build_n>\\d+))?"
serialize = [
    "{major}.{minor}.{patch}-{release}.{pre_n}+build.{build_n}",
    "{major}.{minor}.{patch}+build.{build_n}",
    "{major}.{minor}.{patch}-{release}.{pre_n}",
    "{major}.{minor}.{patch}",
]
allow_dirty = false
# The release flow commits and tags itself (so the changelog lands in the same
# commit as the bump), so bump-my-version must not do either.
commit = false
tag = false

[tool.bumpversion.parts.release]
optional_value = "prod"
values = ["dev", "alpha", "a", "beta", "b", "rc", "prod"]

# Anchored to the [project] table: an unanchored `version = "..."` search would
# also rewrite any [tool.*] table that happens to share the current number.
[[tool.bumpversion.files]]
filename = "pyproject.toml"
regex = true
search = '(?ms)^\[project\]((?:(?!^\[)[\s\S])*?)^version = "{current_version}"'
replace = '[project]\1version = "{new_version}"'

# The workflow stubs under .github/workflows/ are deliberately NOT listed: they
# pin jebel-quant/rhiza's version (the template this repo syncs from), not this
# project's, so rewriting them on a bump would point them at a rhiza tag that
# does not exist. That ref is managed by /rhiza:update via .rhiza/template.yml.
